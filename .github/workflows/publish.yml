name: Publish to npm
on:
  release:
    types: [published]
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Build exactly what was tagged, not whatever is on main
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # package-lock.json is gitignored, so `npm ci` would fail
      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Set package version from release tag
        run: |
          RELEASE_VERSION=${{ github.event.release.tag_name }}
          RELEASE_VERSION=${RELEASE_VERSION#v} # Remove 'v' prefix if present
          # Only changes package.json in the runner; nothing is committed or pushed
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
